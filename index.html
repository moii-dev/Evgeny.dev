<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evgeny.dev — Developer Portfolio</title>
    <meta name="description" content="Portfolio of Evgeny, an Android, UI/UX, and Web developer crafting thoughtful digital experiences and modern applications." />
    <meta property="og:title" content="Evgeny.dev — Developer Portfolio" />
    <meta property="og:description" content="Portfolio of Evgeny, an Android, UI/UX, and Web developer crafting thoughtful digital experiences and modern applications." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Resolve language before the first interface paint. React uses the same preference order. -->
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('evgeny_portfolio_language_v1'); } catch {}
        const language = saved === 'en' || saved === 'ru' ? saved :
          [...(navigator.languages || []), navigator.language || ''].map(value => value.toLowerCase().split(/[-_]/)[0]).find(value => value === 'en' || value === 'ru') || 'en';
        document.documentElement.lang = language;
      })();
    </script>
    <!-- Locally hosted, licensed WOFF2 subsets. -->
    <link rel="stylesheet" href="%BASE_URL%fonts.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='black'><rect width='24' height='24' rx='6' fill='%230f172a'/><path d='M7 6h10v2.5H9.8v3h6.2v2.5H9.8v3.5H17V20H7z' fill='white'/></svg>" />
  </head>
